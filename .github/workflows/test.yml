name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.12"]
        exclude:
          # setup-python has no 3.8 build for Apple-silicon runners
          - os: macos-latest
            python-version: "3.8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate SKILL.md metadata
        run: python tests/validate_skill.py

      - name: Run ledger stress test
        run: python skills/fairsplit/examples/stress_test.py
